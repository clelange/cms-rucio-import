[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-rucio-import"
dynamic = ["version"]
description = "Import legacy CMS datasets and local files into Rucio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "rucio-clients>=39,<40",
    "strictyaml>=1.7",
    "typer>=0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[project.scripts]
cmsrucio-import = "cmsrucio_import.main:app"

[project.urls]
Repository = "https://github.com/clelange/cms-rucio-import"
Issues = "https://github.com/clelange/cms-rucio-import/issues"

[tool.setuptools.dynamic]
version = {attr = "cmsrucio_import.__version__"}

[tool.setuptools.package-data]
cmsrucio_import = ["templates/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
