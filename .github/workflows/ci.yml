name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest
      - run: python -m cmsrucio_import --help
      - run: cmsrucio-import --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build pip
      - run: python -m build
      - name: Verify the wheel
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -m cmsrucio_import --help
          cmsrucio-import --help
          python - <<'PY'
          from importlib.resources import files

          templates = files("cmsrucio_import").joinpath("templates")
          expected = {
              "dataset-upload.yml",
              "dbs-dataset-import.yml",
              "file-upload.yml",
          }
          assert expected == {item.name for item in templates.iterdir()}
          PY
